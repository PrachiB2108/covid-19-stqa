<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Regex tester (client-side)</title>
<style>body{font-family:Segoe UI,Arial,sans-serif;margin:1.5rem;color:#12263a}table{border-collapse:collapse;width:100%}th,td{border:1px solid #cfdde1;padding:.4rem .6rem;text-align:left;font-size:.92rem}th{background:#eef6f7}.pass{color:#14633a;font-weight:600}.fail{color:#c0332b;font-weight:700}code{background:#eef6f7;padding:0 .3rem}</style></head>
<body><h1>Regex tester: JavaScript rules</h1>
<p>Runs every documented case against the regexes in <code>assets/js/script.js</code> and shows the result live. Open this file through your local or hosted project URL.</p>
<p id="summary" role="status"></p>
<h2>Try your own input</h2>
<p><label>Field <select id="f"><option>name</option><option>email</option><option>phone</option><option>password</option></select></label>
<label>Input <input id="i" size="30"></label> <strong id="r"></strong></p>
<table><thead><tr><th>Test ID</th><th>Field</th><th>Input</th><th>Expected</th><th>Actual</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table>
<script src="../assets/js/script.js"></script>
<script>
const CASES=[["TC-REG-001", "name", "Rutvi Landge", true, "Valid", "Two words"], ["TC-REG-002", "name", "12345", false, "Invalid", "Digits only"], ["TC-REG-003", "email", "rutvi@gmail.com", true, "Valid", "Typical email"], ["TC-REG-004", "email", "rutvi@", false, "Invalid", "Missing domain"], ["TC-REG-005", "phone", "9876543210", true, "Valid", "Starts with 9"], ["TC-REG-006", "phone", "1234567890", false, "Invalid", "Starts with 1"], ["TC-REG-007", "password", "Rutvi@123", true, "Valid", "All four classes, 9 chars"], ["TC-REG-008", "password", "password", false, "Invalid", "Lowercase only"], ["TC-REG-009", "name", "Al", true, "Boundary", "Minimum length (2)"], ["TC-REG-010", "name", "A", false, "Boundary", "One below minimum"], ["TC-REG-011", "name", "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA", true, "Boundary", "Maximum length (50)"], ["TC-REG-012", "name", "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA", false, "Boundary", "One above maximum"], ["TC-REG-013", "name", "Rutvi@Landge", false, "Special character", "@ not allowed"], ["TC-REG-014", "name", "", false, "Empty", "Empty string"], ["TC-REG-015", "name", "   ", true, "Whitespace", "Spaces only: regex alone accepts; the app trims first and rejects as empty"], ["TC-REG-016", "email", "", false, "Empty", "Empty string"], ["TC-REG-017", "email", "rutvi.landge+covid@mail.example.co.in", true, "Valid", "Dots, plus tag and subdomain"], ["TC-REG-018", "email", "rutvi gmail.com", false, "Invalid", "Missing @ and contains space"], ["TC-REG-019", "email", "rutvi@gmail.c", false, "Boundary", "TLD of 1 letter"], ["TC-REG-020", "email", "rutvi@gmail.co", true, "Boundary", "TLD of 2 letters"], ["TC-REG-021", "email", "x' OR '1'='1", false, "Special character", "SQL injection style text"], ["TC-REG-022", "phone", "6000000000", true, "Boundary", "Lowest valid first digit (6)"], ["TC-REG-023", "phone", "5999999999", false, "Boundary", "First digit 5 is below allowed range"], ["TC-REG-024", "phone", "987654321", false, "Boundary", "9 digits"], ["TC-REG-025", "phone", "98765432101", false, "Boundary", "11 digits"], ["TC-REG-026", "phone", "98765 43210", false, "Whitespace", "Space inside number"], ["TC-REG-027", "phone", "98765abcde", false, "Special character", "Letters in number"], ["TC-REG-028", "phone", "", false, "Empty", "Empty string"], ["TC-REG-029", "password", "Abcdef1!", true, "Boundary", "Exactly 8 chars"], ["TC-REG-030", "password", "Abcde1!", false, "Boundary", "7 chars"], ["TC-REG-031", "password", "abcdefg1!", false, "Invalid", "No uppercase"], ["TC-REG-032", "password", "ABCDEFG1!", false, "Invalid", "No lowercase"], ["TC-REG-033", "password", "Abcdefgh!", false, "Invalid", "No digit"], ["TC-REG-034", "password", "Abcdefg12", false, "Invalid", "No special character"], ["TC-REG-035", "password", "Abc def12", false, "Whitespace", "Space is not counted as a special character"], ["TC-REG-036", "password", "", false, "Empty", "Empty string"], ["TC-REG-037", "password", "Aa1!xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx", true, "Boundary", "Exactly 64 chars"], ["TC-REG-038", "password", "Aa1!xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx", false, "Boundary", "65 chars"], ["TC-REG-039", "password", "Abc def1!", true, "Whitespace", "Space allowed when a real special char is also present"]];
const RX=window.PortalValidators.RX;let p=0,f=0;const tb=document.getElementById('rows');
CASES.forEach(([id,field,input,exp])=>{const act=RX[field].test(input),ok=act===exp;ok?p++:f++;
 const tr=document.createElement('tr');
 [id,field,input===''?'(empty)':(input.length>30?input.slice(0,12)+'... ('+input.length+' chars)':input),exp?'Valid':'Invalid',act?'Valid':'Invalid'].forEach(t=>{const td=document.createElement('td');td.textContent=t;tr.appendChild(td)});
 const s=document.createElement('td');s.textContent=ok?'Pass':'FAIL';s.className=ok?'pass':'fail';tr.appendChild(s);tb.appendChild(tr)});
document.getElementById('summary').textContent='Total: '+CASES.length+'  Passed: '+p+'  Failed: '+f;
const upd=()=>{const v=document.getElementById('i').value,k=document.getElementById('f').value;document.getElementById('r').textContent=v===''?'':(RX[k].test(v)?'Valid':'Invalid')};
document.getElementById('i').addEventListener('input',upd);document.getElementById('f').addEventListener('change',upd);
</script></body></html>
